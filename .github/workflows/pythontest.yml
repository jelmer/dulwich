name: Python tests

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 6 * * *" # Daily 6AM UTC build

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        exclude:
          - os: windows-11-arm
            python-version: "3.10"
      fail-fast: false

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip
      # TODO: Re-enable the gpg bindings (".[pgp]") on Ubuntu once a gpg
      # release builds with SWIG >= 4.3; 2.0.0 still uses the removed
      # Python 2 compat macros. See Debian bug #1145351.
      - name: Install dependencies
        run: |
          # Install build-time dependencies
          python -m pip install --upgrade "setuptools>=77"
          python -m pip install --upgrade pip
          pip install --upgrade ".[merge,fastimport,https,patiencediff,colordiff,range_diff]"  setuptools-rust
      - name: Install paramiko on platforms with cryptography wheels
        run: pip install --upgrade ".[paramiko]"
        if: "matrix.os != 'windows-11-arm'"
      - name: Install pysequoia on platforms with wheels
        run: pip install --upgrade --only-binary pysequoia ".[sequoia]"
        if: "matrix.os == 'ubuntu-latest' || (matrix.os != 'windows-11-arm' && matrix.python-version != '3.10' && matrix.python-version != '3.15')"
      - name: Style checks
        run: |
          pip install ".[dev]"
          python -m ruff check .
          python -m ruff format --check .
      - name: Typing checks
        run: |
          pip install --upgrade types-paramiko types-requests
          python -m mypy dulwich
        if: "matrix.python-version != 'pypy3' && matrix.os != 'windows-11-arm'"
      - name: Build
        run: |
          python setup.py build_ext -i
        env:
          RUSTFLAGS: "-D warnings"
      - name: Run Rust tests
        run: |
          cargo test
        env:
          RUSTFLAGS: "-D warnings"
      - name: codespell
        run: |
          codespell --config .codespellrc .
      - name: Install subunit
        run: pip install --upgrade python-subunit
      - name: Run test suite
        uses: jelmer/inquest@main
      - name: Property-based tests
        run: |
          pip install --upgrade ".[hypothesis]"
          python -m unittest discover property_tests
        env:
          HYPOTHESIS_PROFILE: ci
      - name: Run contrib tests
        run: |
          python -m unittest contrib.test_suite

  test-minimal:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
        python-version: ["3.10", "3.13"]
        exclude:
          - os: windows-11-arm
            python-version: "3.10"
      fail-fast: false

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip
      - name: Install dependencies (minimal - no optional dependencies or Rust extensions)
        run: |
          python -m pip install --upgrade "setuptools>=77"
          python -m pip install --upgrade pip
          pip install --upgrade .
      - name: Install subunit
        run: pip install --upgrade python-subunit
      - name: Test suite run (minimal dependencies, pure Python)
        uses: jelmer/inquest@main
